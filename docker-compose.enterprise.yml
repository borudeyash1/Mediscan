# MediScan Enterprise — Local Development & CI Infrastructure
# All 6 core data/event services networked on mediscan-net
# Usage: docker compose -f docker-compose.enterprise.yml up -d


x-common: &common
  restart: unless-stopped
  networks:
    - mediscan-net

services:
  # ──────────────────────────────────────────────
  # 1. PostgreSQL 16 — Clinical Transactional Store
  #    Extensions: pgvector, pgcrypto, uuid-ossp
  # ──────────────────────────────────────────────
  postgres-clinical:
    <<: *common
    image: pgvector/pgvector:pg16
    container_name: mediscan-postgres-clinical
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mediscan_clinical
      POSTGRES_USER: mediscan_admin
      POSTGRES_PASSWORD: mediscan_dev_2026
    volumes:
      - pg_clinical_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan_admin -d mediscan_clinical"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # 2. TimescaleDB — High-Frequency Wearable Vitals
  # ──────────────────────────────────────────────
  timescaledb-telemetry:
    <<: *common
    image: timescale/timescaledb:latest-pg16
    container_name: mediscan-timescaledb-telemetry
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mediscan_telemetry
      POSTGRES_USER: mediscan_admin
      POSTGRES_PASSWORD: mediscan_dev_2026
    volumes:
      - tsdb_telemetry_data:/home/postgres/pgdata/data
      - ./infrastructure/docker/init-scripts/timescaledb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan_admin -d mediscan_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # 3. Qdrant — Hybrid Clinical RAG Vector Database
  # ──────────────────────────────────────────────
  qdrant-vector:
    <<: *common
    image: qdrant/qdrant:latest
    container_name: mediscan-qdrant-vector
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # 4. Neo4j — SNOMED-CT / RxNorm / DDI Knowledge Graph
  #    APOC plugin enabled for graph algorithms
  # ──────────────────────────────────────────────
  neo4j-kg:
    <<: *common
    image: neo4j:5-community
    container_name: mediscan-neo4j-kg
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/mediscan_dev_2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mediscan_dev_2026 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ──────────────────────────────────────────────
  # 5. Redpanda (Kafka-compatible) — Real-time RPM Streaming
  # ──────────────────────────────────────────────
  redpanda-kafka:
    <<: *common
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: mediscan-redpanda-kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"  # Kafka API
      - "18082:18082"  # Pandaproxy (REST)
      - "18081:18081"  # Schema Registry
      - "9644:9644"    # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────────
  # 6. Redis (Valkey) — Feast Online Features & Rate-Limiting
  # ──────────────────────────────────────────────
  redis-cache:
    <<: *common
    image: valkey/valkey:8-alpine
    container_name: mediscan-redis-cache
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "notice", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  mediscan-net:
    driver: bridge
    name: mediscan-enterprise-net

volumes:
  pg_clinical_data:
  tsdb_telemetry_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redpanda_data:
  redis_data:
